<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>K.W.BRUUN - Forside</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>

<body>


<!-- HEADER -->
<header>
    <div class="logo">K.W.BRUUN</div>

    <nav>
            <a th:href="@{/}">Forside</a>
            <a th:href="@{/cars}">Biler</a>
            <a th:href="@{/faq}">FAQ</a>
            <a th:href="@{/om-os}">Om os</a>
    </nav>

    <div class="right-section">
        <input type="text" placeholder="Søg..." class="search-box">
        <a th:href="@{/login}">
            <button class="login-btn">Login</button>
        </a>
    </div>
</header>

<!-- OM OS PREVIEW -->
<section>
    <h2>Opret lejeaftale</h2>
    <a th:href="@{lejeaftale}" class="btn">opret</a>
</section>

<!-- TOP BILER -->
<section>
    <h2>Top biler</h2>

    <div class="cars">
        <div class="car-card">
            <img src="images/AudiRS6.jpg" alt="Bil">
            <h4>Audi RS6</h4>
            <p>Fra 4.999 kr/md</p>
        </div>

        <div class="car-card">
            <img src="images/Mercedes%20AMG%20E63.jpg" alt="Bil">
            <h4>Mercedes AMG E63</h4>
            <p>Fra 5.299 kr/md</p>
        </div>

        <div class="car-card">
            <img src="images/BMW%20M8.jpg" alt="Bil">
            <h4>BMW M8</h4>
            <p>Fra 3.499 kr/md</p>
        </div>
    </div>

    <a th:href="@{cars}" class="btn">Se flere</a>
</section>

<!-- KONTAKT + FAQ -->
<section>
    <h2>Kontakt & FAQ</h2>
    <p>Email: kontakt@kwbruun.dk</p>
    <p>Telefon: 12 34 56 78</p>

    <a th:href="@{faq}" class="btn">Gå til FAQ</a>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 K.W.BRUUN</p>
</footer>

</body>
</html>
