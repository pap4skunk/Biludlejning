<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>K.W.BRUUN - Login</title>
  <link rel="stylesheet" th:href="@{/style.css}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>

<body>

<header>
  <div class="logo">K.W.BRUUN</div>

  <nav>
    <a th:href="@{/}">Forside</a>
    <a th:href="@{/cars}">Biler</a>
    <a th:href="@{/faq}">FAQ</a>
    <a th:href="@{/om-os}">Om os</a>
  </nav>

  <div class="right-section">
    <input type="text" placeholder="Søg..." class="search-box">
    <a th:href="@{/login}">
      <button class="login-btn">Login</button>
    </a>
  </div>
</header>

<!-- LOGIN -->
<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post">
      <input type="text" name="username" placeholder="Brugernavn" required>
      <input type="password" name="password" placeholder="Adgangskode" required>

      <button type="submit">Log ind</button>
    </form>

    <a href="#">Glemt adgangskode?</a>
  </div>
</div>

<!-- FOOTER -->


</body>
</html>
